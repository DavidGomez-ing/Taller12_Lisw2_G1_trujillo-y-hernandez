spring:
  application:
    name: saberpro-hexagonal
  datasource:
    url: jdbc:h2:mem:saberprodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# Adaptador de persistencia activo (prueba de intercambiabilidad del Taller 12):
#   jpa    -> JpaQuestionAdapter (Spring Data JPA + H2)
#   memory -> InMemoryQuestionAdapter (HashMap)
saberpro:
  persistence:
    adapter: jpa
